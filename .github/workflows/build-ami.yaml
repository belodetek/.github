---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@4883061bb50f56b4a7fa507eb75b44e5d73c3ca9 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
