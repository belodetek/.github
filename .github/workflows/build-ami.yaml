---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@347f91af7bfd95f8d6962711fb5a9a636755af2c # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
