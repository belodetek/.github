---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@b40c4db799e6dc9017277f57a10d212dbd438d0c # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
