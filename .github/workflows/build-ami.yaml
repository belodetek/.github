---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@b79ea9548426933e6db954f98df6fa4bba161119 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
