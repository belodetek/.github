---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@2f500ef72c7c5ffc1187226bfe5dfdf8679d5261 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
