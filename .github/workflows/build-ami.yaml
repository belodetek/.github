---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@93249b8e67053cd391f10f773f47b6e4c4a845e4 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
