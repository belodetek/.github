---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@be828138c37adb18cb55d6408f1956aa0b3483d9 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
