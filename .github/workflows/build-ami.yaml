---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@75cb18886f4a2584ac615c4098623fac873bbf76 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
