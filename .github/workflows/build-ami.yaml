---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@e02c5309268b8c46e17aa1fe631e64d72c714d68 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
