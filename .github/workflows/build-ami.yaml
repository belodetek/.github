---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@b0a0986fba0b04ef0f485c06af65378461abf56b # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
