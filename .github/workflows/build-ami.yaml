---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@f57aa2f4449b558ebcb3b2478ea0f38a22f71f6e # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
