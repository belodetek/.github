---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@cb26030237dd857fe5006bccffeeb0eb9ad19c8d # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
