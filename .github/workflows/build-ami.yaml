---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@53b86e5430d8f5b1721b252606b0c581426d32a3 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
