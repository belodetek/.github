---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@1138b0eb0efac88004cbd4d1a096e09dbb7366e6 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
