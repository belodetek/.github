---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@7033b8383d365de83b562aaa8b12e5e3f6ddaf7d # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
