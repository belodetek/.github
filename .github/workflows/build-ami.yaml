---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@3452085b370ba2b047d67536f1244b526bf4a596 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
