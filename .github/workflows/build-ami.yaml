---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@70ab1ee5755d3a4e568e7d6ad00724cbd5acdea7 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
