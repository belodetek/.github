---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@2a9a2f632a7d8562b647ec1f43b69b5d033fe395 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
