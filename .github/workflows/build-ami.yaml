---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@9916a57a6244cb149ab213f8dc269559ea12a067 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
