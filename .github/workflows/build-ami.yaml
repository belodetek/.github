---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@22511641bf18a9247125fc127c720c1372f3f556 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
