---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@90bbe9604fef214da6fa1c4045387c102df59a2c # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
