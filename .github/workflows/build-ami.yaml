---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@a6fc40a1c2961bd5e2b6668ac77bde4327009895 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
