---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@07b26d2dff24bbdb777cdb369e3217eff7699d02 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
