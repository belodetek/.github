---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@117b913e194d7014a577b88e48573967972572e1 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
