---
name: Build and register (manually) balenaOS AWS/EC2 AMI
on:
  workflow_dispatch:
    inputs:
      balena_os_version:
        required: false
        type: string

jobs:
  dispatch-import-vm:
    name: call-import-vm
    uses: belodetek/.github/.github/workflows/vmimport.yaml@c58a3ba0b992575b09888c3438276a0a006978b3 # master
    secrets: inherit
    with:
      balena_os_version: ${{ inputs.balena_os_version }}
